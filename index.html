<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1877f2">
<title>SocialX V2.3</title>
<style>
:root{--primary:#1877f2;--bg:#f0f2f5;--card:#fff;--text:#050505;--sub:#65676b;--border:#e4e6eb;--input:#f0f2f5;--danger:#e41e3f;--shadow:0 1px 4px #0001}
body.dark{--bg:#18191a;--card:#242526;--text:#e4e6eb;--sub:#b0b3b8;--border:#393a3b;--input:#3a3b3c;--shadow:0 1px 4px #0004}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:480px;height:100vh;margin:auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
header{height:58px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
.logo{font-size:23px;font-weight:900;color:var(--primary)}
.icon{border:0;background:var(--input);color:var(--text);width:38px;height:38px;border-radius:50%}
.content{flex:1;overflow:auto;padding:12px 12px 78px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border-radius:13px;padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}
.stories{display:flex;gap:9px;overflow:auto;margin-bottom:12px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.story{min-width:78px;height:108px;border-radius:12px;overflow:hidden;position:relative;background:#111;border:2px solid var(--primary)}
.story img,.story video{width:100%;height:100%;object-fit:cover}.story span{position:absolute;bottom:5px;right:4px;left:4px;color:#fff;font-size:10px;text-align:center;text-shadow:0 1px 3px #000}
.addstory{background:var(--input);border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--primary);font-weight:bold}
.trigger{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ddd}.pill{flex:1;background:var(--input);padding:11px 15px;border-radius:22px;color:var(--sub)}
.post-head{display:flex;justify-content:space-between;align-items:center}.user{display:flex;gap:9px;align-items:center;cursor:pointer}.name{font-weight:bold;font-size:14px}.time{font-size:11px;color:var(--sub);margin-top:3px}
.post-text{line-height:1.55;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.media{width:100%;max-height:360px;object-fit:cover;border-radius:9px;background:#000}
.stats{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;border-bottom:1px solid var(--border);padding:8px 0}.actions{display:flex}.action{flex:1;border:0;background:none;color:var(--sub);padding:9px 3px;font-weight:bold;border-radius:7px}.action.liked{color:var(--danger)}.comments{border-top:1px solid var(--border);margin-top:5px;padding-top:8px}.comment{background:var(--input);border-radius:13px;padding:8px 11px;margin:6px 0;font-size:13px}.comment small{color:var(--sub)}
input,textarea,.select{width:100%;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:9px;padding:11px;outline:none;margin:5px 0 9px}.btn{width:100%;border:0;border-radius:9px;padding:11px;background:var(--primary);color:#fff;font-weight:bold}.secondary{background:var(--input);color:var(--text)}.danger{background:var(--danger);color:#fff}
.nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:30}.nav button{flex:1;border:0;background:none;color:var(--sub);font-size:11px}.nav button b{display:block;font-size:20px}.nav button.active{color:var(--primary)}
.search{display:flex;gap:7px}.search input{margin:0}.list{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}.list:last-child{border-bottom:0}.list .left{display:flex;align-items:center;gap:9px;cursor:pointer}.smallbtn{width:auto;padding:7px 10px;font-size:12px}
.profile{text-align:center}.bigavatar{width:90px;height:90px;border-radius:50%;object-fit:cover}.badge{display:inline-block;background:var(--primary);color:#fff;border-radius:20px;padding:4px 9px;font-size:11px;margin-top:6px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:100}.modal.show{display:flex}.modalbox{width:100%;max-width:480px;margin:auto 0 0;background:var(--card);border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.close{border:0;background:var(--input);color:var(--text);border-radius:50%;width:34px;height:34px}
.auth{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:100%;max-width:400px;background:var(--card);padding:24px;border-radius:18px;box-shadow:var(--shadow)}.authbox h1{color:var(--primary);text-align:center;margin-bottom:5px}.authbox p{text-align:center;color:var(--sub);margin-bottom:18px}.switch{text-align:center;color:var(--primary);margin-top:14px;cursor:pointer}.error{color:var(--danger);font-size:13px;text-align:center;min-height:18px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 17px;border-radius:22px;z-index:200;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div id="authScreen" class="auth">
  <div class="authbox">
    <h1>SocialX</h1><p id="authSubtitle">سجّل دخولك إلى حسابك</p>
    <div id="loginForm">
      <input id="loginEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="loginPassword" type="password" placeholder="كلمة المرور">
      <button class="btn" onclick="login()">تسجيل الدخول</button>
      <div class="switch" onclick="showRegister()">إنشاء حساب جديد</div>
    </div>
    <div id="registerForm" class="hidden">
      <input id="regName" maxlength="40" placeholder="اسمك">
      <input id="regEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="regPassword" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)">
      <button class="btn" onclick="register()">إنشاء الحساب</button>
      <div class="switch" onclick="showLogin()">لدي حساب بالفعل</div>
    </div>
    <div id="authError" class="error"></div>
  </div>
</div>

<div id="app" class="app hidden">
<header><div class="logo">SocialX</div><div><button class="icon" onclick="toggleDark()">🌙</button></div></header>
<div class="content">
  <section id="homePage" class="page active">
    <div class="stories" id="stories"></div>
    <div class="card trigger" onclick="openModal('postModal')"><img id="myAvatarTop" class="avatar"><div class="pill">بم تفكر اليوم؟</div></div>
    <div id="feed"></div>
  </section>

  <section id="searchPage" class="page">
    <div class="card">
      <h3 style="margin-bottom:10px">🔎 اكتشاف المستخدمين</h3>
      <div class="search"><input id="searchInput" placeholder="ابحث بالاسم..." oninput="renderUsers()"></div>
      <div id="usersList"></div>
    </div>
  </section>

  <section id="notificationsPage" class="page">
    <div class="card"><h3>🔔 الإشعارات</h3><div id="notifications"></div></div>
  </section>

  <section id="profilePage" class="page">
    <div class="card profile">
      <img id="profileAvatar" class="bigavatar">
      <h2 id="profileName"></h2><span class="badge">عضو SocialX</span>
      <input id="newName" maxlength="40" placeholder="تغيير الاسم">
      <button class="btn" onclick="saveName()">حفظ الاسم</button>
      <input id="avatarInput" type="file" accept="image/*">
      <button class="btn secondary" onclick="uploadAvatar()">تغيير الصورة</button>
      <button class="btn secondary" style="margin-top:8px" onclick="toggleDark()">تبديل الوضع الليلي 🌙</button>
      <button class="btn danger" style="margin-top:8px" onclick="logout()">تسجيل الخروج</button>
    </div>
    <h3 style="margin:10px 4px">منشوراتي</h3><div id="myPosts"></div>
  </section>

  <section id="userPage" class="page">
    <button class="btn secondary" onclick="go('homePage')" style="margin-bottom:10px">← رجوع</button>
    <div class="card profile"><img id="otherAvatar" class="bigavatar"><h2 id="otherName"></h2><div id="friendAction"></div></div>
    <div id="otherPosts"></div>
  </section>
</div>
<div class="nav">
<button id="navHome" class="active" onclick="go('homePage')"><b>🏠</b>الرئيسية</button>
<button id="navSearch" onclick="go('searchPage');renderUsers()"><b>🔎</b>اكتشاف</button>
<button onclick="openModal('postModal')"><b>➕</b>نشر</button>
<button id="navNotif" onclick="go('notificationsPage');renderNotifications()"><b>🔔</b>إشعارات</button>
<button id="navProfile" onclick="go('profilePage');renderProfile()"><b>👤</b>حسابي</button>
</div>
</div>

<div id="postModal" class="modal"><div class="modalbox">
<div class="modalhead"><h3>منشور جديد</h3><button class="close" onclick="closeModal('postModal')">✕</button></div>
<textarea id="postText" rows="4" maxlength="5000" placeholder="اكتب شيئاً..."></textarea>
<input id="postFile" type="file" accept="image/*,video/*">
<button id="publishBtn" class="btn" onclick="createPost()">نشر الآن</button>
</div></div>

<div id="storyModal" class="modal"><div class="modalbox">
<div class="modalhead"><h3>قصة جديدة</h3><button class="close" onclick="closeModal('storyModal')">✕</button></div>
<input id="storyFile" type="file" accept="image/*,video/*">
<button class="btn" onclick="createStory()">نشر القصة</button>
</div></div>

<div id="toast" class="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getDatabase,ref,set,push,onValue,update,remove} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyD3dC6ucOkNeo65pHx4JzPDwQ_jgciBu6Q",
 authDomain:"facebook-b5664.firebaseapp.com",
 databaseURL:"https://facebook-b5664-default-rtdb.firebaseio.com",
 projectId:"facebook-b5664",
 storageBucket:"facebook-b5664.firebasestorage.app",
 messagingSenderId:"314653723710",
 appId:"1:314653723710:web:c788497dfa805de6e3556f"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const CLOUD_NAME="dgzcvymc",UPLOAD_PRESET="ml_default";
let me=null,posts={},users={},friends={},stories={},notes={};

const $=id=>document.getElementById(id);
window.showRegister=()=>{$('loginForm').classList.add('hidden');$('registerForm').classList.remove('hidden');$('authSubtitle').textContent='أنشئ حسابك في SocialX';$('authError').textContent=''};
window.showLogin=()=>{$('registerForm').classList.add('hidden');$('loginForm').classList.remove('hidden');$('authSubtitle').textContent='سجّل دخولك إلى حسابك';$('authError').textContent=''};

function authMsg(e){const m={ 'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة.','auth/email-already-in-use':'هذا البريد مستخدم بالفعل.','auth/weak-password':'كلمة المرور ضعيفة.','auth/invalid-email':'البريد الإلكتروني غير صالح.','auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً.'};$('authError').textContent=m[e.code]||e.message||'حدث خطأ';}
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$('loginEmail').value.trim(),$('loginPassword').value)}catch(e){authMsg(e)}};
window.register=async()=>{const name=$('regName').value.trim(),email=$('regEmail').value.trim(),pass=$('regPassword').value;if(!name)return $('authError').textContent='اكتب اسمك أولاً';if(pass.length<6)return $('authError').textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل';try{const c=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(c.user,{displayName:name});await set(ref(db,'users/'+c.user.uid),{id:c.user.uid,name,avatar:'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(name),createdAt:Date.now()});}catch(e){authMsg(e)}};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{me=u;if(u){$('authScreen').classList.add('hidden');$('app').classList.remove('hidden');startData();}else{$('app').classList.add('hidden');$('authScreen').classList.remove('hidden');}});

function startData(){
 onValue(ref(db,'users'),s=>{users=s.val()||{};renderUsers();renderProfile();});
 onValue(ref(db,'posts'),s=>{posts=s.val()||{};renderFeed();renderMyPosts();});
 onValue(ref(db,'friendships'),s=>{friends=s.val()||{};renderUsers();});
 onValue(ref(db,'stories'),s=>{stories=s.val()||{};renderStories();});
 onValue(ref(db,'notifications/'+me.uid),s=>{notes=s.val()||{};renderNotifications();});
}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function avatar(id){return users[id]?.avatar||'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(users[id]?.name||id)}
function friendKey(a,b){return [a,b].sort().join('_')}
function status(id){const f=friends[friendKey(me.uid,id)];if(!f)return'none';if(f.status==='accepted')return'friends';return f.from===me.uid?'sent':'received'}
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function ago(t){let d=Math.floor((Date.now()-t)/1000);if(d<60)return'الآن';if(d<3600)return Math.floor(d/60)+' د';if(d<86400)return Math.floor(d/3600)+' س';return Math.floor(d/86400)+' يوم'}
function upload(file){return new Promise((res,rej)=>{const f=new FormData();f.append('file',file);f.append('upload_preset',UPLOAD_PRESET);const x=new XMLHttpRequest();x.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);x.onload=()=>x.status>=200&&x.status<300?res(JSON.parse(x.responseText).secure_url):rej();x.onerror=rej;x.send(f)})}

function renderStories(){const el=$('stories');el.innerHTML=`<div class="story addstory" onclick="openModal('storyModal')"><b style="font-size:25px">+</b><span style="position:static;color:var(--primary)">قصتك</span></div>`;Object.entries(stories).filter(([k,s])=>Date.now()-s.timestamp<86400000).sort((a,b)=>b[1].timestamp-a[1].timestamp).forEach(([k,s])=>{const d=document.createElement('div');d.className='story';d.onclick=()=>viewStory(s);d.innerHTML=`${s.mediaType==='video'?`<video src="${esc(s.mediaUrl)}"></video>`:`<img src="${esc(s.mediaUrl)}">`}<span>${esc(s.userName)}</span>`;el.appendChild(d)})}
window.viewStory=s=>{const w=window.open('','_blank','width=400,height=700');if(w)w.document.write(s.mediaType==='video'?`<video src="${esc(s.mediaUrl)}" controls autoplay style="width:100%;height:100%;background:#000"></video>`:`<img src="${esc(s.mediaUrl)}" style="width:100%;height:100%;object-fit:contain;background:#000">`)};

function postHTML(k,p){
 const likes=Object.keys(p.likes||{}), comments=Object.values(p.comments||{}), liked=!!p.likes?.[me.uid], owner=p.userId===me.uid;
 return `<div class="card" id="p_${k}"><div class="post-head"><div class="user" onclick="viewUser('${p.userId}')"><img class="avatar" src="${esc(p.userAvatar)}"><div><div class="name">${esc(p.userName)}</div><div class="time">${ago(p.timestamp)}</div></div></div>${owner?`<button class="icon" onclick="deletePost('${k}')">🗑️</button>`:''}</div>
 <div class="post-text">${esc(p.text)}</div>${p.mediaUrl?(p.mediaType==='video'?`<video class="media" controls playsinline src="${esc(p.mediaUrl)}"></video>`:`<img class="media" src="${esc(p.mediaUrl)}">`):''}
 <div class="stats"><span>❤️ ${likes.length} إعجاب</span><span>💬 ${comments.length} تعليق</span></div><div class="actions"><button class="action ${liked?'liked':''}" onclick="likePost('${k}')">❤️ ${liked?'أعجبني':'إعجاب'}</button><button class="action" onclick="toggleComments('${k}')">💬 تعليق</button><button class="action" onclick="sharePost('${k}')">↗️ مشاركة</button></div>
 <div class="comments hidden" id="c_${k}">${comments.map(c=>`<div class="comment"><b>${esc(c.userName)}</b><br>${esc(c.text)}<br><small>${ago(c.timestamp)}</small></div>`).join('')}<div class="search"><input id="ci_${k}" placeholder="اكتب تعليقاً..."><button class="btn smallbtn" onclick="comment('${k}')">إرسال</button></div></div></div>`
}
function renderFeed(){const arr=Object.entries(posts).sort((a,b)=>b[1].timestamp-a[1].timestamp);$('feed').innerHTML=arr.length?arr.map(([k,p])=>postHTML(k,p)).join(''):'<div class="card" style="text-align:center;color:var(--sub)">لا توجد منشورات بعد.</div>'}
function renderMyPosts(){$('myPosts').innerHTML=Object.entries(posts).filter(([k,p])=>p.userId===me?.uid).sort((a,b)=>b[1].timestamp-a[1].timestamp).map(([k,p])=>postHTML(k,p)).join('')||'<div class="card">لا توجد منشورات.</div>'}

window.createPost=async()=>{const text=$('postText').value.trim(),file=$('postFile').files[0],b=$('publishBtn');if(!text&&!file)return toast('اكتب شيئاً أو اختر ملفاً');b.disabled=true;b.textContent='جاري النشر...';try{let url='',type='';if(file){if(file.size>50*1024*1024)throw Error('حجم الملف أكبر من 50MB');type=file.type.startsWith('video/')?'video':'image';url=await upload(file)}await push(ref(db,'posts'),{userId:me.uid,userName:me.displayName||users[me.uid]?.name||'مستخدم',userAvatar:avatar(me.uid),text,mediaUrl:url,mediaType:type,timestamp:Date.now()});$('postText').value='';$('postFile').value='';closeModal('postModal');toast('تم نشر المنشور ❤️')}catch(e){toast(e.message||'فشل النشر')}finally{b.disabled=false;b.textContent='نشر الآن'}};
window.deletePost=k=>{if(confirm('حذف المنشور؟'))remove(ref(db,'posts/'+k))};
window.likePost=k=>{const r=ref(db,`posts/${k}/likes/${me.uid}`);posts[k]?.likes?.[me.uid]?remove(r):set(r,true)};
window.toggleComments=k=>$('c_'+k).classList.toggle('hidden');
window.comment=k=>{const i=$('ci_'+k),t=i.value.trim();if(!t)return;push(ref(db,`posts/${k}/comments`),{userId:me.uid,userName:me.displayName||users[me.uid]?.name||'مستخدم',text:t,timestamp:Date.now()});i.value=''};
window.sharePost=async k=>{const url=location.href+'#post-'+k;try{await navigator.clipboard.writeText(url);toast('تم نسخ رابط المنشور')}catch{toast('تم تجهيز رابط المنشور')}};

window.createStory=async()=>{const file=$('storyFile').files[0];if(!file)return toast('اختر صورة أو فيديو');try{const type=file.type.startsWith('video/')?'video':'image',url=await upload(file);await push(ref(db,'stories'),{userId:me.uid,userName:me.displayName||users[me.uid]?.name||'مستخدم',mediaUrl:url,mediaType:type,timestamp:Date.now()});$('storyFile').value='';closeModal('storyModal');toast('تم نشر القصة')}catch{toast('فشل رفع القصة')}};

function renderUsers(){if(!$('usersList'))return;const q=($('searchInput')?.value||'').trim().toLowerCase();$('usersList').innerHTML=Object.entries(users).filter(([id,u])=>id!==me?.uid&&(u.name||'').toLowerCase().includes(q)).map(([id,u])=>{const s=status(id);let b=s==='none'?`<button class="btn smallbtn" onclick="sendFriend('${id}')">إضافة</button>`:s==='sent'?`<button class="btn secondary smallbtn" onclick="removeFriend('${id}')">إلغاء</button>`:s==='received'?`<button class="btn smallbtn" onclick="acceptFriend('${id}')">قبول</button>`:`<button class="btn secondary smallbtn" onclick="removeFriend('${id}')">صديق ✓</button>`;return `<div class="list"><div class="left" onclick="viewUser('${id}')"><img class="avatar" src="${esc(u.avatar)}"><b>${esc(u.name)}</b></div>${b}</div>`}).join('')||'<p style="color:var(--sub);padding:10px">لا يوجد مستخدمون.</p>'}
async function notify(uid,type,text){if(uid===me.uid)return;await push(ref(db,'notifications/'+uid),{type,text,from:me.uid,timestamp:Date.now(),read:false})}
window.sendFriend=async id=>{await set(ref(db,'friendships/'+friendKey(me.uid,id)),{from:me.uid,to:id,status:'pending',timestamp:Date.now()});await notify(id,'friend',`${me.displayName||'مستخدم'} أرسل لك طلب صداقة 👥`);toast('تم إرسال الطلب')};
window.acceptFriend=async id=>{await update(ref(db,'friendships/'+friendKey(me.uid,id)),{status:'accepted'});await notify(id,'friend',`${me.displayName||'مستخدم'} قبل طلب صداقتك 🎉`);toast('تم قبول الطلب')};
window.removeFriend=id=>remove(ref(db,'friendships/'+friendKey(me.uid,id)));

function renderNotifications(){const a=Object.values(notes).sort((x,y)=>y.timestamp-x.timestamp);$('notifications').innerHTML=a.map(n=>`<div class="list"><div><b>${esc(n.text)}</b><br><small style="color:var(--sub)">${ago(n.timestamp)}</small></div></div>`).join('')||'<p style="color:var(--sub);padding:10px">لا توجد إشعارات.</p>'}
window.viewUser=id=>{const u=users[id];if(!u)return;currentOther=id;$('otherAvatar').src=avatar(id);$('otherName').textContent=u.name;const s=status(id);$('friendAction').innerHTML=s==='none'?`<button class="btn" onclick="sendFriend('${id}')">إضافة صديق ➕</button>`:s==='sent'?`<button class="btn secondary" onclick="removeFriend('${id}')">إلغاء الطلب</button>`:s==='received'?`<button class="btn" onclick="acceptFriend('${id}')">قبول الطلب ✔️</button>`:`<button class="btn secondary" onclick="removeFriend('${id}')">إزالة الصداقة</button>`;$('otherPosts').innerHTML=Object.entries(posts).filter(([k,p])=>p.userId===id).sort((a,b)=>b[1].timestamp-a[1].timestamp).map(([k,p])=>postHTML(k,p)).join('')||'<div class="card">لا توجد منشورات.</div>';go('userPage')};
let currentOther='';
window.saveName=async()=>{const n=$('newName').value.trim();if(!n)return toast('اكتب الاسم');await updateProfile(me,{displayName:n});await update(ref(db,'users/'+me.uid),{name:n});toast('تم تحديث الاسم')};
window.uploadAvatar=async()=>{const f=$('avatarInput').files[0];if(!f)return toast('اختر صورة');try{const u=await upload(f);await updateProfile(me,{photoURL:u});await update(ref(db,'users/'+me.uid),{avatar:u});toast('تم تغيير الصورة')}catch{toast('فشل رفع الصورة')}};
function renderProfile(){if(!me)return;const u=users[me.uid];$('profileAvatar').src=u?.avatar||me.photoURL||avatar(me.uid);$('myAvatarTop').src=u?.avatar||me.photoURL||avatar(me.uid);$('profileName').textContent=u?.name||me.displayName||'مستخدم';$('newName').value=u?.name||me.displayName||''}
window.go=id=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(id==='homePage')$('navHome').classList.add('active');if(id==='searchPage')$('navSearch').classList.add('active');if(id==='notificationsPage')$('navNotif').classList.add('active');if(id==='profilePage')$('navProfile').classList.add('active')};
window.openModal=id=>$(id).classList.add('show');window.closeModal=id=>$(id).classList.remove('show');
window.toggleDark=()=>{document.body.classList.toggle('dark');localStorage.setItem('sx_dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('sx_dark')==='1')document.body.classList.add('dark');
</script>
</body>
